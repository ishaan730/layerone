.co img { height: 22px; opacity: .9; }
.r { position: absolute; right: -40px; top: 40px; width: 560px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; transform: rotate(-4deg); }
.r img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; }
